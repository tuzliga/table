<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Тузлига</title>

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="./style.css"
  />

  <!-- FONT AWESOME -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <!-- LUCIDE -->

  <script
    src="https://unpkg.com/lucide@latest"
  ></script>

</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="league-info">

      <img
        id="league-logo"
        class="league-logo"
        src=""
        alt="Логотип"
      />

      <div class="league-text">

        <h1 id="league-name">
          ТУЗЛИГА
        </h1>

        <p id="season">
          СЕЗОН 2026
        </p>

      </div>

    </div>

  </header>

 <!-- TOP NAVIGATION -->

<nav class="tabs">

  <button
    class="tab active"
    data-tab="table">

    <div class="tab-content">
      <i data-lucide="trophy"></i>
      <span>ТАБЛИЦА</span>
    </div>

  </button>

  <button
    class="tab"
    data-tab="matches">

    <div class="tab-content">
      <i data-lucide="calendar-days"></i>
      <span>МАТЧИ</span>
    </div>

  </button>

  <button
    class="tab"
    data-tab="scorers">

    <div class="tab-content">
      <i class="
        fa-regular
        fa-futbol
        football-icon
      "></i>

      <span>
        БОМБАРДИРЫ
      </span>
    </div>

  </button>

</nav>
  <!-- SUB NAV -->

  <div class="mode-switch">

    <button
      class="mode active"
      data-mode="short"
    >
      ВКРАТЦЕ
    </button>

    <button
      class="mode"
      data-mode="full"
    >
      ПОЛНОСТЬЮ
    </button>

    <button
      class="mode"
      data-mode="form"
    >
      ФОРМА
    </button>

  </div>

  <!-- TABLE -->

  <div
    id="table-container"
  ></div>

</div>

<script src="app.js"></script>

<script>
  lucide.createIcons();
</script>

</body>
</html>
